<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection — OPEL</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="../media/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../media/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body data-base="../" data-page="collection">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <p class="page-hero__eyebrow">Museum catalogue</p>
          <h1 class="page-hero__title">Collection</h1>
          <p class="page-hero__lead">
            Opel automobiles produced before 2007 — browse by model, generation, or year.
          </p>
        </div>
      </section>
      <section class="section surface-white">
        <div class="container">
          <div class="collection-toolbar">
            <label class="sr-only" for="collection-search">Search collection</label>
            <input
              id="collection-search"
              type="search"
              placeholder="Search model, generation, year…"
              autocomplete="off"
            />
          </div>
          <div class="tile-grid" id="collection-grid"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site-content-patches.js"></script>
    <script src="../js/concepts-article-patches.js"></script>
    <script src="../js/site-content-images.js"></script>
    <script src="../js/opc-article-patches.js"></script>
    <script src="../js/car-content-patches.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages.js"></script>
  </body>
</html>

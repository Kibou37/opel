<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery — OPEL</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="../media/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../media/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body data-base="../" data-page="gallery">
    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <p class="page-hero__eyebrow">Photography</p>
          <h1 class="page-hero__title">Gallery</h1>
          <p class="page-hero__lead">
            Collection photography, banners, and World of Opel images — open fullscreen and browse with next / previous.
          </p>
        </div>
      </section>
      <section class="section surface-white">
        <div class="container">
          <div class="gallery-grid" id="gallery-grid"></div>
        </div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button type="button" class="lightbox__close" id="lightbox-close">Close</button>
      <button type="button" class="lightbox__prev" id="lightbox-prev">← Prev</button>
      <div id="lightbox-stage"></div>
      <button type="button" class="lightbox__next" id="lightbox-next">Next →</button>
    </div>

    <div id="site-footer"></div>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages.js"></script>
  </body>
</html>
